name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: treesitter-mcp
            asset_stem: treesitter-mcp-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: treesitter-mcp.exe
            asset_stem: treesitter-mcp-x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: treesitter-mcp
            asset_stem: treesitter-mcp-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: treesitter-mcp
            asset_stem: treesitter-mcp-aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "dist/${{ matrix.artifact_name }}"
          tar -czf "${{ matrix.asset_stem }}.tar.gz" -C dist "${{ matrix.artifact_name }}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset_stem }}.tar.gz" | awk '{print $1}' > "${{ matrix.asset_stem }}.tar.gz.sha256"
          else
            sha256sum "${{ matrix.asset_stem }}.tar.gz" | awk '{print $1}' > "${{ matrix.asset_stem }}.tar.gz.sha256"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_stem }}.tar.gz
            ${{ matrix.asset_stem }}.tar.gz.sha256
          generate_release_notes: true



